[project]
name = "workshop"
version = "0.1.0"
description = "PyFlink Stream Processing Workshop"
requires-python = ">=3.12"
dependencies = [
    "kafka-python>=2.3.0",
    "pandas>=2.2.0",
    "pgcli>=4.2.0",
    "psycopg-binary>=3.0.0",
    # "psycopg2-binary>=2.9.11",
    # "psycopg[binary]>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=19.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "tqdm>=4.67.3",
]
